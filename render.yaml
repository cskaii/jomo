services:
  - type: web
    name: jomo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.setup && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: AUTO_SEED_CATALOG
        value: "false"
      - key: AI_PRESIDIO_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: supabase
      - key: AUTH_ISSUER_URL
        sync: false
      - key: AUTH_PUBLIC_KEY
        sync: false
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
