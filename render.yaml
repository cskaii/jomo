services:
  - type: web
    name: jomo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: AUTO_SEED_CATALOG
        value: "false"
      - key: AI_PRESIDIO_ENABLED
        value: "true"
      - key: AI_SPACY_MODEL
        value: en_core_web_sm
      - key: REQUEST_MAX_BODY_BYTES
        value: "3145728"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: supabase
      - key: AUTH_ISSUER_URL
        sync: false
      - key: AUTH_PUBLIC_KEY
        sync: false
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
